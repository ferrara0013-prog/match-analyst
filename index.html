<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#234598">
<title>MATCH ANALISYS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#234598;--field:#EDF1F4;--board:#2F78C9;--onbg:#FFFFFF;--onbg2:rgba(255,255,255,.88);--surface:#FFFFFF;--ink:#0E1B27;--muted:#5C6E7E;--line:#D3DCE3;--court:#14406B;--a:#1B5FA8;--b:#C2403A;--ball:#E4E24A;--ok:#1F7A4D;--bad:#B3302A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#172E63;--field:#0B1620;--board:#2766AD;--surface:#13212D;--ink:#E7EEF4;--muted:#8EA2B3;--line:#28394A;--court:#0E2F4F;--a:#5AA2EB;--b:#EE7A72;--ok:#55C08B;--bad:#F08A84}}
:root[data-theme="dark"]{--bg:#172E63;--field:#0B1620;--board:#2766AD;--surface:#13212D;--ink:#E7EEF4;--muted:#8EA2B3;--line:#28394A;--court:#0E2F4F;--a:#5AA2EB;--b:#EE7A72;--ok:#55C08B;--bad:#F08A84}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
@media (max-width:600px){main{padding-top:36px}}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;margin:0;font-weight:700}
h1{font-size:2.4rem;line-height:1.05;color:var(--onbg)}
h2{font-size:1.3rem;margin:22px 0 8px;color:var(--onbg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.muted{color:var(--onbg2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
/* setup */
.setup label{display:block;font-weight:600;margin:12px 0 4px}
.setup input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pair>div{min-width:0}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px}
.chk input{width:20px;height:20px;margin-top:2px}
.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:600;background:var(--court);color:#fff}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.65);color:#fff}
.card .btn.ghost{border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.full{width:100%;margin-top:18px}
/* scoreboard */
.mlab{display:block;color:var(--onbg2);font-weight:600;font-size:.9rem}
.mtitle{width:100%;font:700 2.4rem/1.1 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;color:var(--ink);background:var(--bg);border:0;border-bottom:2px solid var(--line);padding:4px 0;margin-bottom:8px;border-radius:0}
.addm{display:flex;gap:8px;margin:6px 0 12px}
.addm input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.addm .btn{padding:10px 14px}
.fld{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);margin-top:4px;min-width:0;max-width:100%;height:44px;font-size:16px;line-height:1.2;-webkit-appearance:none;appearance:none}
input[type=date].fld{display:block;text-align:left}
input[type=date].fld::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
.board{background:var(--board);color:#fff;border-radius:14px;padding:12px 14px;border:2px solid rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(0,0,0,.28)}
.row{display:flex;align-items:center;gap:4px;padding:8px 0}
.row+.row{border-top:2px solid rgba(255,255,255,.85)}
.head{padding:0 0 2px;font-size:.78rem;opacity:.8}
.tn{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--tc)}
.n{width:2.6rem;text-align:center;font:700 1.7rem/1 "Barlow Condensed","Arial Narrow",sans-serif}
.head .n{font:600 .78rem/1 "Barlow",sans-serif}
.n.pt{color:var(--ball);font-size:2.2rem}
.n.cur{background:rgba(255,255,255,.14);border-radius:6px;padding:4px 0}
.status{margin-top:8px;font-size:.9rem;min-height:1.3em}
.t0{--tc:#6FB0F2}.t1{--tc:#F08A84}
/* players */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;min-height:68px}
.pl b{display:block;font-size:1.05rem}
.pl small{color:var(--muted)}
.pl.sel.p0{border-color:var(--a);background:color-mix(in srgb,var(--a) 14%,var(--surface))}
.pl.sel.p1{border-color:var(--b);background:color-mix(in srgb,var(--b) 14%,var(--surface))}
.pl.p0{border-left:6px solid var(--a)}.pl.p1{border-left:6px solid var(--b)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.act{padding:13px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.act.good{border-color:var(--ok)}
.act.err{border-color:var(--bad)}
.act:disabled{background:color-mix(in srgb,var(--surface) 78%,var(--muted));color:var(--muted);cursor:not-allowed}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hint{margin:6px 0 0;font-size:.92rem;color:var(--onbg2)}
.card .muted,.card .hint{color:var(--muted)}
/* tabs */
.tabs{display:flex;gap:6px;margin:14px 0}
.tab{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;font-weight:600}
.tab[aria-selected="true"]{background:#fff;color:var(--court);border-color:#fff}
/* stats */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:9px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.85rem}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
tr:last-child td{border-bottom:0}
td.p0:first-child{border-left:6px solid var(--a)}td.p1:first-child{border-left:6px solid var(--b)}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad);font-weight:600}
.bar{display:flex;height:28px;border-radius:8px;overflow:hidden;margin:8px 0 10px;border:2px solid #fff;background:rgba(255,255,255,.2)}
.bar span{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.9rem;min-width:0}
.bar .ba{background:#6FB0F2;color:#0E1B27}.bar .bb{background:#F08A84;color:#0E1B27}
.log{list-style:none;margin:0;padding:0}
.log li{padding:7px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.log li:last-child{border-bottom:0}
.info{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:12px}
.info b{display:block;color:var(--onbg)}
.th2{display:flex;align-items:center;font:700 1.2rem/1.2 "Barlow Condensed","Arial Narrow",system-ui,sans-serif;margin:0 0 6px;color:var(--onbg)}
.th2::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--tc);box-shadow:0 0 0 2px #fff}
tr.hi td{background:color-mix(in srgb,var(--ok) 20%,var(--surface))}
tr.lo td{background:color-mix(in srgb,var(--bad) 20%,var(--surface))}
.end{background:var(--ball);color:#1b1b00;border-radius:10px;padding:10px 12px;font-weight:600;margin-top:10px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY="padel-stats-v1";
const ACTS=[["ace","Ace",1],["win","Colpo vincente",1],["smash","Smash",1],["volee","Volée",1],["bajada","Bandeja",1],["vibora","Vibora",1],["gancio","Gancio",1],["une","Errore non forzato",0],["df","Doppio fallo",0]];
const LBL=Object.fromEntries(ACTS.map(a=>[a[0],a[1]]));
const WINK=["ace","win","smash","volee","bajada","vibora","gancio"],ERRK=["une","df"];
let S={started:false,golden:true,names:["Giocatore 1","Giocatore 2","Giocatore 3","Giocatore 4"],ev:[]};
let sel=null,tab="match",confirmReset=false;
try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r&&Array.isArray(r.names)&&r.names.length===4&&Array.isArray(r.ev))S=r}catch(e){}
if(!Array.isArray(S.teams))S.teams=["",""];
if(!Array.isArray(S.maestri))S.maestri=[];if(typeof S.maestro!=="string")S.maestro="";if(typeof S.club!=="string")S.club="";if(typeof S.date!=="string")S.date="";if(!["normal","tb7","tb10"].includes(S.third))S.third="normal";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tn=t=>(S.teams&&S.teams[t])||S.names[t*2]+" / "+S.names[t*2+1];

function isThird(m){return !m.over&&(S.third==="tb7"||S.third==="tb10")&&m.sets.length===2&&m.w[0]===1&&m.w[1]===1}
function endSet(m,t){m.sets.push([...m.g]);m.w[t]++;m.g=[0,0];m.p=[0,0];m.tb=false;if(m.w[t]===2)m.over=true}
function point(m,t){
  const o=1-t;
  if(isThird(m)){
    const tgt=S.third==="tb10"?10:7;
    m.p[t]++;
    if(m.p[t]>=tgt&&m.p[t]-m.p[o]>=2){m.sets.push([...m.p]);m.w[t]++;m.over=true;m.p=[0,0];m.g=[0,0]}
    return;
  }
  if(m.tb){m.p[t]++;if(m.p[t]>=7&&m.p[t]-m.p[o]>=2){m.g[t]++;endSet(m,t)}return}
  m.p[t]++;
  const won=S.golden?m.p[t]>=4:(m.p[t]>=4&&m.p[t]-m.p[o]>=2);
  if(!won)return;
  m.p=[0,0];m.g[t]++;
  if(m.g[t]>=6&&m.g[t]-m.g[o]>=2)endSet(m,t);
  else if(m.g[0]===6&&m.g[1]===6)m.tb=true;
}
function compute(){
  const m={sets:[],g:[0,0],p:[0,0],tb:false,w:[0,0],over:false};
  for(const e of S.ev){if(m.over)break;point(m,e.t)}
  return m;
}
function ptl(m,t){
  if(m.tb||isThird(m))return String(m.p[t]);
  const o=1-t,L=["0","15","30","40"];
  if(!S.golden&&m.p[t]>=3&&m.p[o]>=3){return m.p[t]>m.p[o]?"Van":"40"}
  return L[m.p[t]];
}
function stats(){
  const P=[0,1,2,3].map(()=>({ace:0,win:0,smash:0,volee:0,bajada:0,vibora:0,gancio:0,une:0,fe:0,df:0}));
  const T=[{tot:0,win:0,err:0,plain:0},{tot:0,win:0,err:0,plain:0}];
  S.ev.forEach(e=>{
    T[e.t].tot++;
    if(e.p==null)T[e.t].plain++;
    else{P[e.p][e.k]++;if(WINK.includes(e.k))T[e.t].win++;else T[e.t].err++}
  });
  return{P,T};
}
const sum=(o,ks)=>ks.reduce((a,k)=>a+o[k],0);

function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function mopts(){return `<option value="">MATCH ANALISYS</option>`+S.maestri.map(n=>`<option value="${esc(n)}" ${n===S.maestro?"selected":""}>${esc(n)}</option>`).join("")}
function viewSetup(){
  return `<div class="pair"><div><label class="mlab" for="club">Circolo</label><input id="club" class="fld" type="text" value="${esc(S.club||"")}" maxlength="40" placeholder="Nome del circolo"></div><div><label class="mlab" for="mdate">Data</label><input id="mdate" class="fld" type="date" value="${esc(S.date||todayStr())}"></div></div><h1 style="margin:14px 0 8px">MATCH ANALISYS</h1><div class="addm"><input id="newm" type="text" list="mlist" value="${esc(S.maestro||"")}" placeholder="Nome del maestro" maxlength="24" aria-label="Nome del maestro"><datalist id="mlist">${S.maestri.map(n=>`<option value="${esc(n)}">`).join("")}</datalist></div><p class="muted">Registra colpo per colpo una partita e guarda le statistiche di ogni giocatore.</p>
  <div class="card setup"><div class="pair">
  <div style="grid-column:1/-1"><label for="t0">Nome squadra 1 (facoltativo)</label><input id="t0" type="text" value="${esc((S.teams&&S.teams[0])||"")}" maxlength="24"></div>
  <div><label for="n0">Squadra 1, giocatore di DX</label><input id="n0" type="text" value="${esc(S.names[0])}" maxlength="20"></div>
  <div><label for="n1">Squadra 1, giocatore di SX</label><input id="n1" type="text" value="${esc(S.names[1])}" maxlength="20"></div>
  <div style="grid-column:1/-1"><label for="t1">Nome squadra 2 (facoltativo)</label><input id="t1" type="text" value="${esc((S.teams&&S.teams[1])||"")}" maxlength="24"></div>
  <div><label for="n2">Squadra 2, giocatore di DX</label><input id="n2" type="text" value="${esc(S.names[2])}" maxlength="20"></div>
  <div><label for="n3">Squadra 2, giocatore di SX</label><input id="n3" type="text" value="${esc(S.names[3])}" maxlength="20"></div></div>
  <label class="chk"><input id="gold" type="checkbox" ${S.golden?"checked":""}><span><b>Punto d’oro</b><br><span class="muted">Sul 40-40 decide un solo punto. Se lo togli, si gioca con i vantaggi.</span></span></label>
  <div style="margin-top:16px"><label for="third">Terzo set</label><select id="third" class="fld"><option value="normal" ${S.third==="normal"?"selected":""}>Set normale</option><option value="tb7" ${S.third==="tb7"?"selected":""}>Tie-break a 7 punti</option><option value="tb10" ${S.third==="tb10"?"selected":""}>Tie-break a 10 punti</option></select></div>
  <button class="btn full" data-a="start">Inizia la partita</button>
  <p class="hint">Si gioca al meglio dei 3 set, con tie-break sul 6-6.</p></div>`;
}

function viewBoard(m){
  const nSets=m.sets.length;
  const head=`<div class="row head"><div class="tn" style="font-weight:400"></div>${m.sets.map((_,i)=>`<div class="n">Set ${i+1}</div>`).join("")}<div class="n">Game</div><div class="n">Punti</div></div>`;
  const rows=[0,1].map(t=>`<div class="row"><div class="tn t${t}">${esc(tn(t))}</div>${m.sets.map(s=>`<div class="n">${s[t]}</div>`).join("")}<div class="n cur">${isThird(m)?"–":m.g[t]}</div><div class="n pt">${ptl(m,t)}</div></div>`).join("");
  let st="";
  if(m.over){st="Partita finita"}
  else if(isThird(m)){st="Terzo set: tie-break a "+(S.third==="tb10"?10:7)+" punti"}
  else if(m.tb){st="Tie-break in corso"}
  else if(S.golden&&m.p[0]===3&&m.p[1]===3){st="Punto d’oro: chi vince il punto vince il game"}
  else if(!S.golden&&m.p[0]>=3&&m.p[1]>=3){st=m.p[0]===m.p[1]?"Parità":"Vantaggio"}
  return `<div class="board">${head}${rows}<div class="status">${st}</div></div>`;
}

function viewMatch(m,X){
  const dis=m.over?"disabled":"";
  const plBtn=i=>{
    const w=sum(X.P[i],WINK),e=sum(X.P[i],ERRK),t=i<2?0:1;
    return `<button class="pl p${t} ${sel===i?"sel":""}" data-a="sel" data-v="${i}" aria-pressed="${sel===i}" ${dis}><b>${esc(S.names[i])} (${i%2===0?"DX":"SX"})</b><small>${w} vincenti, ${e} errori</small></button>`;
  };
  const act=(a)=>`<button class="act ${a[2]?"good":"err"}" data-a="act" data-v="${a[0]}" ${sel==null||m.over?"disabled":""}>${a[1]}</button>`;
  const winner=m.w[0]>m.w[1]?0:1;
  const last=S.ev.slice(-6).reverse().map(e=>{
    const who=e.p==null?"Punto per "+tn(e.t):esc(S.names[e.p])+": "+LBL[e.k];
    return `<li>${e.p==null?esc(who):who}</li>`;
  }).join("");
  return `${viewBoard(m)}
  ${m.over?`<div class="end">Vince ${esc(tn(winner))} ${m.sets.map(s=>s[winner]+"-"+s[1-winner]).join(", ")}</div>`:""}
  <h2>1. Scegli il giocatore</h2>
  <div class="grid2"><div>${teamHead(0)}${plBtn(0)}${plBtn(1)}</div><div>${teamHead(1)}${plBtn(2)}${plBtn(3)}</div></div>
  <h2>2. Scegli cosa è successo</h2>
  <p class="hint" style="margin:0 0 8px">${sel==null?"Tocca prima un giocatore.":"Il punto va a chi ha fatto il colpo vincente, oppure agli avversari se è un errore."}</p>
  <div class="acts">${ACTS.filter(a=>a[2]).map(act).join("")}</div>
  <div class="acts" style="margin-top:8px">${ACTS.filter(a=>!a[2]).map(act).join("")}</div>
  <div class="tools">
    <button class="btn ghost" data-a="plain" data-v="0" ${dis}>Punto ${S.teams[0]?esc(S.teams[0]):"squadra 1"} senza dettaglio</button>
    <button class="btn ghost" data-a="plain" data-v="1" ${dis}>Punto ${S.teams[1]?esc(S.teams[1]):"squadra 2"} senza dettaglio</button>
    <button class="btn ghost" data-a="undo" ${S.ev.length?"":"disabled"}>Annulla ultimo punto</button>
  </div>
  ${last?`<h2>Ultimi punti</h2><div class="card"><ul class="log">${last}</ul></div>`:""}`;
}

function teamHead(t){return S.teams&&S.teams[t]?`<div class="th2 t${t}">${esc(S.teams[t])}</div>`:""}
function fmtDate(d){const p=(d||"").split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:(d||"")}
function viewInfo(){
  const it=[["Circolo",S.club],["Data",fmtDate(S.date)],["Maestro",S.maestro]].filter(x=>x[1]);
  return it.length?`<div class="info">${it.map(x=>`<div><span class="mlab">${x[0]}</span><b>${esc(x[1])}</b></div>`).join("")}</div>`:"";
}
function viewStats(m,X){
  const cols=["Vincenti","Errori","Bilancio","Ace","Colpo vinc.","Smash","Volée","Bandeja","Vibora","Gancio","Err. non forz.","Doppi falli"];
  const hasT=!!(S.teams[0]||S.teams[1]);
  const bal=[0,1,2,3].map(i=>sum(X.P[i],WINK)-sum(X.P[i],ERRK));const sb=[...bal].sort((x,y)=>y-x);
  const cls=b=>(b>=sb[1]&&b>sb[2])?"hi":(b<=sb[2]&&b<sb[1])?"lo":"";
  const rows=[0,1,2,3].map(i=>{
    const p=X.P[i],w=sum(p,WINK),e=sum(p,ERRK),b=w-e,t=i<2?0:1;
    return `<tr class="${cls(b)}"><td class="p${t}">${esc(S.names[i])}</td>${hasT?`<td>${esc(S.teams[t]||"Squadra "+(t+1))}</td>`:""}<td>${w}</td><td>${e}</td><td class="${b>0?"pos":b<0?"neg":""}">${b>0?"+":""}${b}</td><td>${p.ace}</td><td>${p.win}</td><td>${p.smash}</td><td>${p.volee}</td><td>${p.bajada}</td><td>${p.vibora}</td><td>${p.gancio}</td><td>${p.une}</td><td>${p.df}</td></tr>`;
  }).join("");
  const tot=X.T[0].tot+X.T[1].tot;
  const pc=t=>tot?Math.round(X.T[t].tot/tot*100):50;
  const tr=t=>`<tr><td class="p${t}">${esc(tn(t))}</td><td>${X.T[t].tot}</td><td>${X.T[t].win}</td><td>${X.T[t].err}</td><td>${X.T[t].plain}</td></tr>`;
  return `${viewInfo()}${viewBoard(m)}<h2>Punti vinti</h2>
  <div class="bar" role="img" aria-label="Punti vinti: squadra 1 ${X.T[0].tot}, squadra 2 ${X.T[1].tot}"><span class="ba" style="width:${pc(0)}%">${X.T[0].tot||""}</span><span class="bb" style="width:${pc(1)}%">${X.T[1].tot||""}</span></div>
  <div class="scroll"><table><thead><tr><th>Squadra</th><th>Totale</th><th>Da colpi vincenti</th><th>Da errori avversari</th><th>Senza dettaglio</th></tr></thead><tbody>${tr(0)}${tr(1)}</tbody></table></div>
  <h2>Giocatori</h2>
  <div class="scroll"><table><thead><tr><th>Giocatore</th>${hasT?"<th>Squadra</th>":""}${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
  <p class="hint">Vincenti: ace, colpi vincenti, smash, volée, bandeja, vibora e gancio. Errori: non forzati e doppi falli. Bilancio: vincenti meno errori. In verde i due giocatori con il bilancio migliore, in rosso i due con il bilancio peggiore.</p>`;
}

function render(){
  const app=document.getElementById("app");
  if(!S.started){app.innerHTML=viewSetup();return}
  const m=compute(),X=stats();
  app.innerHTML=`<div class="tabs" role="tablist">
    <button class="tab" role="tab" data-a="tab" data-v="match" aria-selected="${tab==="match"}">Partita</button>
    <button class="tab" role="tab" data-a="tab" data-v="stats" aria-selected="${tab==="stats"}">Statistiche</button></div>
    ${tab==="match"?viewMatch(m,X):viewStats(m,X)}
    <div class="tools" style="margin-top:28px"><button class="btn ghost" data-a="reset">${confirmReset?"Conferma: cancella tutto e ricomincia":"Nuova partita"}</button></div>`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a!=="reset")confirmReset=false;
  if(a==="start"){
    S.names=[0,1,2,3].map(i=>(document.getElementById("n"+i).value.trim()||"Giocatore "+(i+1)));
    S.teams=[0,1].map(i=>document.getElementById("t"+i).value.trim());
    S.club=document.getElementById("club").value.trim();S.date=document.getElementById("mdate").value;{const nm=document.getElementById("newm").value.trim();S.maestro=nm;if(nm&&!S.maestri.includes(nm))S.maestri.push(nm)}
    S.third=document.getElementById("third").value;S.golden=document.getElementById("gold").checked;S.ev=[];S.started=true;sel=null;tab="match";
  }else if(a==="tab"){tab=v}
  else if(a==="sel"){sel=sel===+v?null:+v}
  else if(a==="act"&&sel!=null){
    const win=WINK.includes(v),own=sel<2?0:1;
    S.ev.push({p:sel,k:v,t:win?own:1-own});sel=null;
  }
  else if(a==="plain"){S.ev.push({p:null,k:"plain",t:+v});sel=null}
  else if(a==="addm"){
    const nm=document.getElementById("newm").value.trim();
    S.names=[0,1,2,3].map(i=>(document.getElementById("n"+i).value.trim()||"Giocatore "+(i+1)));
    S.teams=[0,1].map(i=>document.getElementById("t"+i).value.trim());
    S.golden=document.getElementById("gold").checked;
    S.club=document.getElementById("club").value.trim();S.date=document.getElementById("mdate").value;
    S.maestro=document.getElementById("mae").value;
    if(nm){if(!S.maestri.includes(nm))S.maestri.push(nm);S.maestro=nm}
  }
  else if(a==="undo"){S.ev.pop()}
  else if(a==="reset"){
    if(confirmReset){S.started=false;S.ev=[];sel=null;confirmReset=false}else confirmReset=true;
  }
  save();render();
});
document.addEventListener("change",e=>{if(e.target.id==="mae"){S.maestro=e.target.value;save()}});
render();
</script>
</body>
</html>
